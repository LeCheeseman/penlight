<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penlight</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Header: daily goal + progress -->
    <header id="top-bar">
        <div id="goal-setting">
            <label for="dailyGoal">Word Goal</label>
            <input type="number" id="dailyGoal">
            <button id="setGoalBtn">Set</button>
        </div>

        <div id="progress-wrap">
            <div id="progress-circle">
                <span id="progress-text">0%</span>
            </div>
        </div>
    </header>

    <!-- Main writing area -->
    <main>
        <textarea id="writer" placeholder="Start writing..."></textarea>
    </main>

    <script src="script.js"></script>
</body>
</html>
